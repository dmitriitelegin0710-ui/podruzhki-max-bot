name: GDELT News Test

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить поиск GDELT
        run: python news/gdelt_search.py

      - name: Показать содержимое articles.json
        run: |
          echo "===== ARTICLES.JSON ====="
          head -c 12000 news/articles.json
          echo
          echo "===== END ====="

      - name: Сохранить articles.json
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-articles
          path: news/articles.json
