name: RSS News Test

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить сбор новостей из RSS
        run: python news/rss_search.py

      - name: Показать содержимое filtered_articles.json
        run: |
          echo "===== FILTERED_ARTICLES.JSON ====="
          head -c 12000 news/filtered_articles.json
          echo
          echo "===== END ====="

      - name: Сохранить отфильтрованные статьи
        uses: actions/upload-artifact@v4
        with:
          name: filtered-articles
          path: news/filtered_articles.json
