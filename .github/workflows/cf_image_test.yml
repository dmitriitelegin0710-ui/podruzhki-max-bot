# Положить в репозиторий по пути:
#   .github/workflows/cf_image_test.yml
# Запускается ТОЛЬКО вручную (Actions → Cloudflare Image Test → Run workflow).
# Основной автопостинг не затрагивает и ничего не публикует в канал.
name: Cloudflare Image Test
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Модель (пусто = FLUX schnell). Для сравнения: @cf/stabilityai/stable-diffusion-xl-base-1.0"
        required: false
        default: ""
      samples:
        description: "Сколько вариантов на каждый промпт"
        required: false
        default: "2"
      steps:
        description: "Шаги для FLUX (1-8, больше = качественнее и дороже)"
        required: false
        default: "4"
      only:
        description: "Прогнать только промпт с этим словом в названии (например: test_ruki). Пусто = все"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: pip install requests
      - name: Сгенерировать тестовые картинки
        run: python -u cf_image_test.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_MODEL: ${{ github.event.inputs.model }}
          SAMPLES: ${{ github.event.inputs.samples }}
          STEPS: ${{ github.event.inputs.steps }}
          ONLY: ${{ github.event.inputs.only }}
      - name: Сохранить картинки как файл запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-test-images
          path: out/
          if-no-files-found: warn
