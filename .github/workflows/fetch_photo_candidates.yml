name: Fetch photo candidates

# Запускается ТОЛЬКО вручную (кнопка "Run workflow" во вкладке Actions),
# не по расписанию — это разовый/повторяемый по требованию инструмент
# для наполнения вашей локальной коллекции кандидатов на фото, а не
# постоянная автоматизация бота.
on:
  workflow_dispatch:
    inputs:
      rubric:
        description: "Ключ одной рубрики (пусто = все рубрики сразу)"
        required: false
        default: ""
      per_topic:
        description: "Сколько фото скачать на тему"
        required: false
        default: "50"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.rubric }}" ]; then
            python fetch_photo_candidates.py --rubric "${{ github.event.inputs.rubric }}" --per-topic "${{ github.event.inputs.per_topic }}"
          else
            python fetch_photo_candidates.py --per-topic "${{ github.event.inputs.per_topic }}"
          fi

      # Упаковывает папку candidates/ в zip и делает доступной для скачивания
      # со страницы запуска (вкладка Actions -> этот запуск -> Artifacts).
      - name: Upload candidates as artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-candidates
          path: candidates/
          retention-days: 14
