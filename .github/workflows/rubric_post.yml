# Этот файл нужно положить в репозитории по пути:
#   .github/workflows/rubric_post.yml
name: MAX Rubric Autopost
on:
  schedule:
    # Каждые 15 минут, но НЕ в круглые :00/:30 (в них чаще всего скапливаются
    # чужие workflow по всему миру, и тик GitHub может задерживаться/теряться).
    # Время UTC. Окно 3:00–17:59 UTC = 6:00–20:59 по Москве — с запасом
    # покрывает все рубрики (первая в 07:00, последняя в 20:00 МСК).
    - cron: "7,22,37,52 3-17 * * *"
  workflow_dispatch: {}
jobs:
  post:
    runs-on: ubuntu-latest
    concurrency:
      group: rubric-post
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        # Раньше зависимости ставились вручную ("pip install requests
        # pytz") в обход requirements.txt — из-за этого boto3 (нужен
        # photo_bank.py для доступа к бакету Yandex Object Storage) тут
        # не появился бы, даже если его добавить в requirements.txt.
        # Теперь ставим всё из requirements.txt, как и в news_post.yml.
        run: pip install -r requirements.txt pytz
      - name: Установить российский сертификат Минцифры (нужен для доступа к platform-api2.max.ru)
        run: |
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          sudo update-ca-certificates
      - name: Запустить публикацию по рубрикам
        run: python rubric_post_to_max.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          MAX_BOT_USERNAME: ${{ secrets.MAX_BOT_USERNAME }}
          # Ключ Kinopoisk Unofficial API (kinopoiskapiunofficial.tech) для
          # рубрики «Что посмотреть вечером» (kino_serial) — см. kino_source.py.
          # Если секрет не задан, рубрика просто не опубликуется (ошибка
          # логируется), остальные рубрики не затрагиваются.
          KINOPOISK_API_KEY: ${{ secrets.KINOPOISK_API_KEY }}
          # Доступ к бакету Yandex Object Storage (liftdocs-files) со
          # своей базой фото под рубрики — см. photo_bank.py. Пока эти
          # два секрета не заданы (или папка рубрики в бакете ещё
          # пустая), photo_bank.get_own_photo() просто вернёт None и
          # rubric_post_to_max.py как и раньше возьмёт фото с Pexels —
          # ничего не ломается.
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          # Публикация в Telegram-канал опциональна — если эти два секрета
          # не заданы в репозитории, telegram_common.is_configured() вернёт
          # False и rubric_post_to_max.py просто пропустит публикацию туда,
          # ничего не сломав в шаге для MAX.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      - name: Сохранить журнал опубликованных рубрик, состояние ротации фото и список показанных фильмов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Все файлы необязательны на первом запуске (posted_rubrics.json
          # появляется после первой успешной публикации, photo_bank_state.json —
          # после первого взятия фото из своей базы в бакете, used_movies.json —
          # после первой публикации рубрики «Что посмотреть вечером») —
          # добавляем в коммит только то, что реально существует.
          for f in posted_rubrics.json photo_bank_state.json used_movies.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "Изменений нет — коммитить нечего"
            exit 0
          fi

          git commit -m "Обновлён журнал опубликованных рубрик, состояние ротации фото и список показанных фильмов"

          # УСТОЙЧИВОСТЬ К ГОНКАМ: concurrency выше защищает только от
          # параллельных запусков ЭТОГО ЖЕ workflow, но не от любого другого
          # коммита в main, случившегося между checkout и этим push (ручная
          # правка файла на GitHub, другой workflow и т.п.). Раньше при
          # такой гонке git push падал с "fetch first" и весь запуск
          # завершался ошибкой, хотя публикация в MAX уже прошла успешно —
          # терялась только галочка "опубликовано" в журнале, что грозило
          # дублем поста на следующем запуске.
          #
          # Теперь при неудаче подтягиваем свежий main (--rebase переносит
          # наш локальный коммит поверх новых чужих изменений) и пробуем
          # запушить снова, до 5 раз с небольшой паузой.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Журнал успешно сохранён (попытка $attempt)"
              exit 0
            fi
            echo "Push не прошёл (попытка $attempt из 5) — подтягиваю свежий main и пробую снова"
            git pull --rebase origin main
            sleep 5
          done

          echo "::error::Не удалось запушить журнал опубликованных рубрик после 5 попыток"
          exit 1
