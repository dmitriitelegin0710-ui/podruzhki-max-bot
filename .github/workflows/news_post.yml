name: News Rewrite & Post
on:
  schedule:
    # Слоты публикации новостей (МСК): 09:05, 13:15, 17:25 — они заданы в
    # rewrite_and_post.py (NEWS_SLOTS), между рубриками.
    #
    # ВАЖНО: GitHub Actions не гарантирует запуск по расписанию — тик может
    # прийти с большим опозданием (на практике 40-75 минут и больше) или
    # вообще пропасть. Один запуск на слот из-за этого регулярно терялся.
    # Поэтому в окне каждого слота запуски идут КАЖДЫЕ 15 МИНУТ (как у
    # рубрик), а скрипт сам решает, пора ли публиковать: если слот уже
    # отработан или время не пришло — выходит за секунды; если слот
    # пропущен — догоняет на следующем тике, но только в пределах 2 часов
    # после времени слота (новость не выйдет позже 19:25, до "Вечернего
    # ритуала" в 20:20). Минуты 7/22/37/52, а не круглые — в :00/:30 у
    # GitHub самая большая очередь.
    # Время в cron — UTC (МСК = UTC+3).
    - cron: "7,22,37,52 6,7 * * *"    # 09:07–10:52 МСК — слот 09:05
    - cron: "7,22,37,52 10,11 * * *"  # 13:07–14:52 МСК — слот 13:15
    - cron: "7,22,37,52 14,15 * * *"  # 17:07–18:52 МСК — слот 17:25
    - cron: "7 16 * * *"              # 19:07 МСК — последний шанс для слота 17:25
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Предпросмотр (true) — показать пост в логе, ничего не публикуя; false — опубликовать по-настоящему"
        required: false
        default: true
        type: boolean
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: news-post
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Установить российский сертификат Минцифры (нужен для доступа к platform-api2.max.ru)
        run: |
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          sudo update-ca-certificates
      - name: Собрать статьи из тех же RSS-источников, что и сайт
        run: python news/rss_search.py
      - name: Рерайт и публикация в MAX и Telegram
        run: python news/rewrite_and_post.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          # Публикация в Telegram-канал опциональна — если эти два
          # секрета не заданы в репозитории, telegram_common.is_configured()
          # вернёт False и rewrite_and_post.py просто пропустит публикацию
          # туда, ничего не сломав в шаге для MAX.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          # При ручном запуске берётся выбор из галочки dry_run. При запуске
          # по расписанию inputs пустой — DRY_RUN будет пустой строкой, что
          # равносильно false: по расписанию всегда идёт настоящая публикация.
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Сохранить журнал опубликованных новостей и слотов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in news/posted_news.json news/posted_news_slots.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "Изменений нет — коммитить нечего"
            exit 0
          fi

          git commit -m "Обновлён журнал опубликованных новостей"

          # Параллельно работает workflow рубрик и тоже пушит в main — при
          # гонке обычный git push падает с "fetch first", и тогда терялась бы
          # отметка "опубликовано" (следующий запуск мог бы продублировать
          # пост). Поэтому при неудаче подтягиваем свежий main и повторяем.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Журнал успешно сохранён (попытка $attempt)"
              exit 0
            fi
            echo "Push не прошёл (попытка $attempt из 5) — подтягиваю свежий main и пробую снова"
            git pull --rebase origin main
            sleep 5
          done

          echo "::error::Не удалось запушить журнал новостей после 5 попыток"
          exit 1
