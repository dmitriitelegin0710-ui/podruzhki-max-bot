# Этот файл нужно положить в репозитории по пути:
#   .github/workflows/post.yml
#
# GitHub сам найдёт его по этому пути и включит расписание.
name: MAX Autopost
on:
  schedule:
    - cron: "0 * * * *"   # каждый час в 00 минут (время UTC)
  workflow_dispatch: {}     # позволяет запускать вручную кнопкой в интерфейсе GitHub
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно, чтобы workflow мог сохранить posted.json обратно в репозиторий
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: pip install requests pytz
      - name: Установить российский сертификат Минцифры (нужен для доступа к platform-api2.max.ru)
        run: |
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          sudo curl -sk -o /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          sudo update-ca-certificates
      - name: Запустить публикацию
        run: python post_to_max.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
      - name: Сохранить список опубликованных постов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "Обновлён список опубликованных постов"
          git push
